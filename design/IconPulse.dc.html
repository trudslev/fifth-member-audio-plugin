<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</helmet>
<div style="position:relative;width:256px;height:256px;overflow:hidden;border-radius:52px;background:linear-gradient(165deg,#1a1917 0%,#0f0f0d 50%,#080907 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.06)">
  <div style="position:absolute;left:22px;right:22px;top:22px;bottom:22px;border-radius:30px;background:linear-gradient(180deg,#04100a,#020806);border:1px solid #2b2a25;box-shadow:inset 0 4px 18px rgba(0,0,0,.9)">
    <div style="position:absolute;inset:0;border-radius:30px;background:radial-gradient(70% 70% at 50% 60%, rgba(90,220,140,.10), rgba(0,0,0,0) 70%)"></div>
    <div style="position:absolute;left:26px;right:26px;bottom:50px;height:2px;background:rgba(140,200,160,.28)"></div>
    <div style="position:absolute;left:26px;right:26px;bottom:50px;height:112px;display:flex;align-items:flex-end;gap:15px">
      <div style="width:11px;height:112px;background:linear-gradient(180deg,#a9ffcd,#3ee089);border-radius:2px;box-shadow:0 0 16px rgba(70,230,140,.9)"></div>
      <div style="width:11px;height:74px;background:linear-gradient(180deg,#8ff2bb,#31c876);border-radius:2px;box-shadow:0 0 13px rgba(70,230,140,.72)"></div>
      <div style="width:11px;height:48px;background:linear-gradient(180deg,#74d9a3,#26a660);border-radius:2px;box-shadow:0 0 11px rgba(70,230,140,.55)"></div>
      <div style="width:11px;height:30px;background:linear-gradient(180deg,#5cb888,#1e8a50);border-radius:2px;box-shadow:0 0 9px rgba(70,230,140,.42)"></div>
      <div style="width:11px;height:18px;background:#187a45;border-radius:2px;box-shadow:0 0 7px rgba(70,230,140,.3)"></div>
      <div style="width:11px;height:10px;background:#125c34;border-radius:2px"></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:256}}"></script>
</body>
</html>
