<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="position:relative;width:256px;height:256px;overflow:hidden;border-radius:52px;background:linear-gradient(165deg,#201e1b 0%,#131211 48%,#0a0a08 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.07)">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,.055) 1px 3px)"></div>
  <div style="position:absolute;left:38px;top:38px;width:180px;height:180px;border-radius:50%;background:conic-gradient(from 0deg, rgba(255,255,255,.10) 0deg, rgba(255,255,255,.02) 40deg, rgba(255,255,255,.10) 90deg, rgba(255,255,255,.02) 150deg, rgba(255,255,255,.09) 220deg, rgba(255,255,255,.02) 300deg, rgba(255,255,255,.10) 360deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)"></div>
  <div style="position:absolute;left:56px;top:56px;width:144px;height:144px;border-radius:50%;background:radial-gradient(circle at 34% 26%, #6d685f 0%, #3a3833 40%, #171613 78%);box-shadow:0 12px 26px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.16), inset 0 -8px 18px rgba(0,0,0,.7)"></div>
  <div style="position:absolute;left:56px;top:56px;width:144px;height:144px;border-radius:50%;background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.055) 0deg 1.4deg, rgba(0,0,0,0) 1.4deg 9deg);mask-image:radial-gradient(circle, transparent 52%, #000 54%)"></div>
  <div style="position:absolute;left:124px;top:64px;width:8px;height:56px;border-radius:4px;background:linear-gradient(180deg,#f2ecdd,#b3ab99);transform:rotate(38deg);transform-origin:4px 64px;box-shadow:0 0 10px rgba(0,0,0,.6)"></div>
  <div style="position:absolute;left:120px;top:120px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #55514a, #171613);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)"></div>
  <div style="position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;align-items:center;gap:11px">
    <div style="width:11px;height:11px;border-radius:50%;background:#ff9a2e;box-shadow:0 0 13px rgba(255,150,40,.9)"></div>
    <div style="font:700 21px 'Barlow Condensed';letter-spacing:.30em;color:#b9b2a4">TAPE</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:256}}"></script>
</body>
</html>
